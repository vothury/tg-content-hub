<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{% block title %}TG Content Hub{% endblock %}</title>
  <link rel="icon" href="/static/icon.svg" type="image/svg+xml">
  <link rel="manifest" href="/static/manifest.webmanifest">
  <meta name="theme-color" content="#0f1115">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="/static/icon.svg">
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <div class="topbar">
    <div class="brand">TG Content Hub</div>
        <button id="bell" class="bell" title="Уведомления">🔕</button>
    <span id="mon" class="mon" title=""></span>
    <button class="burger" type="button" onclick="document.body.classList.toggle('menu-open')">☰</button>
  </div>

  <div id="monPanel" class="monpanel"></div>
  <div class="backdrop" onclick="document.body.classList.remove('menu-open')"></div>

  <nav class="menu">
    <a href="/" class="{{ 'active' if active == 'dashboard' else '' }}">Дашборд</a>
    <a href="/posts" class="{{ 'active' if active == 'posts' else '' }}">Посты</a>
    <a href="/queue" class="{{ 'active' if active == 'queue' else '' }}">Очередь</a>
    <a href="/stats" class="{{ 'active' if active == 'stats' else '' }}">Статистика</a>
    <a href="/settings" class="{{ 'active' if active == 'settings' else '' }}">Настройки</a>
    <a href="/content" class="{{ 'active' if active == 'content' else '' }}">Контент</a>
    <form method="post" action="/logout" class="menu-logout">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <button class="menu-logout-btn js-logout" type="submit">⎋ Выйти</button>
    </form>
  </nav>

  <nav class="nav">
    <a href="/" class="{{ 'active' if active == 'dashboard' else '' }}">Дашборд</a>
    <a href="/posts" class="{{ 'active' if active == 'posts' else '' }}">Посты</a>
    <a href="/queue" class="{{ 'active' if active == 'queue' else '' }}">Очередь</a>
    <a href="/stats" class="{{ 'active' if active == 'stats' else '' }}">Статистика</a>
    <a href="/settings" class="{{ 'active' if active == 'settings' else '' }}">Настройки</a>
    <a href="/content" class="{{ 'active' if active == 'content' else '' }}">Контент</a>
    <form method="post" action="/logout" class="navlogout">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <button class="nav-logout-btn js-logout" type="submit" title="Выйти">⎋</button>
    </form>
  </nav>

  <main class="content">
    {% block content %}{% endblock %}
  </main>
<script>
var MON=null,MONH='';
function mon(){fetch('/api/status').then(function(r){return r.ok?r.json():null;}).then(function(d){
  var el=document.getElementById('mon');if(!el||!d)return;MON=d;
  var t=new Date(d.checked_at);MONH=('0'+t.getHours()).slice(-2)+':'+('0'+t.getMinutes()).slice(-2);
  if(d.ok){el.textContent='🟢 OK ('+MONH+')';el.className='mon ok';}
  else{el.textContent='🔴 '+d.problems.length+' ('+MONH+')';el.className='mon bad';}
}).catch(function(){});}
mon();setInterval(mon,60000);
document.getElementById('mon').addEventListener('click',function(){
  var p=document.getElementById('monPanel');if(!MON)return;
  if(p.style.display==='block'){p.style.display='none';return;}
  p.textContent=MON.ok?('Все процессы в норме.\nПроверено в '+MONH):('Проблемы ('+MON.problems.length+'):\n• '+MON.problems.join('\n• ')+'\nПроверено в '+MONH);
  p.style.display='block';
});
document.querySelectorAll('.js-logout').forEach(function(b){
  var orig=b.textContent;
  b.addEventListener('click',function(e){
    if(!b.dataset.armed){e.preventDefault();b.dataset.armed='1';b.textContent='Точно выйти?';b.classList.add('armed');
      setTimeout(function(){delete b.dataset.armed;b.textContent=orig;b.classList.remove('armed');},3000);}
  });
});
var BELL=document.getElementById('bell');
function setBell(on){BELL.textContent=on?'🔔':'🔕';}
setBell(localStorage.getItem('notify')==='1');
function notifyLocal(t,b){
  if('serviceWorker' in navigator){navigator.serviceWorker.ready.then(function(r){r.showNotification(t,{body:b,icon:'/static/icon.svg'});}).catch(function(){});}
  else if('Notification' in window&&Notification.permission==='granted'){new Notification(t,{body:b});}
}
BELL.addEventListener('click',function(){
  if(localStorage.getItem('notify')==='1'){localStorage.removeItem('notify');setBell(false);return;}
  if(!('Notification' in window)){alert('Уведомления не поддерживаются');return;}
  Notification.requestPermission().then(function(p){
    if(p!=='granted')return;
    localStorage.setItem('notify','1');setBell(true);
    if('serviceWorker' in navigator){navigator.serviceWorker.register('/sw.js').catch(function(){});}
    fetch('/api/notify').then(function(r){return r.json();}).then(function(d){localStorage.setItem('notify_last',String(d.last));});
    notifyLocal('Уведомления включены','Новые посты на ревью будут приходить сюда');
  });
});
setInterval(function(){
  if(localStorage.getItem('notify')!=='1')return;
  fetch('/api/notify').then(function(r){return r.json();}).then(function(d){
    var last=parseInt(localStorage.getItem('notify_last')||'0',10);
    if(d.last>last){localStorage.setItem('notify_last',String(d.last));notifyLocal('Новый пост на ревью','#'+d.last+' ожидает вашего решения');}
    else if(last===0){localStorage.setItem('notify_last',String(d.last));}
  }).catch(function(){});
},30000);
</script>
</body>
</html>
