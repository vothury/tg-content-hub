<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{% block title %}TG Content Hub{% endblock %}</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <div class="topbar">
    <button class="burger" type="button" onclick="document.body.classList.toggle('menu-open')">☰</button>
    <div class="brand">TG Content Hub</div>
    <span id="mon" class="mon" title=""></span>
    <form method="post" action="/logout">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <button class="btn ghost" type="submit">Выйти</button>
    </form>
  </div>

  <nav class="menu">
    <a href="/" class="{{ 'active' if active == 'dashboard' else '' }}">Дашборд</a>
    <a href="/posts" class="{{ 'active' if active == 'posts' else '' }}">Посты</a>
    <a href="/settings" class="{{ 'active' if active == 'settings' else '' }}">Настройки</a>
    <a href="/content" class="{{ 'active' if active == 'content' else '' }}">Контент</a>
    <a href="/queue" class="{{ 'active' if active == 'queue' else '' }}">Очередь</a>
    <a href="/stats" class="{{ 'active' if active == 'stats' else '' }}">Статистика</a>
  </nav>

  <nav class="nav">
    <a href="/" class="{{ 'active' if active == 'dashboard' else '' }}">Дашборд</a>
    <a href="/posts" class="{{ 'active' if active == 'posts' else '' }}">Посты</a>
    <a href="/settings" class="{{ 'active' if active == 'settings' else '' }}">Настройки</a>
    <a href="/content" class="{{ 'active' if active == 'content' else '' }}">Контент</a>
    <a href="/queue" class="{{ 'active' if active == 'queue' else '' }}">Очередь</a>
    <a href="/stats" class="{{ 'active' if active == 'stats' else '' }}">Статистика</a>
  </nav>

  <main class="content">
    {% block content %}{% endblock %}
  </main>
<script>
function mon(){fetch('/api/status').then(function(r){return r.ok?r.json():null;}).then(function(d){
  var el=document.getElementById('mon');if(!el||!d)return;
  var t=new Date(d.checked_at);var hh=('0'+t.getHours()).slice(-2)+':'+('0'+t.getMinutes()).slice(-2);
  if(d.ok){el.textContent='🟢 OK ('+hh+')';el.className='mon ok';el.title='Проверено в '+hh;}
  else{el.textContent='🔴 '+d.problems.length+' ('+hh+')';el.className='mon bad';el.title=d.problems.join('\n');}
}).catch(function(){});}
mon();setInterval(mon,60000);
</script>
</body>
</html>
