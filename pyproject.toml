[project]
name = "tg-content-hub"
version = "0.1.0"
description = "Единый центр наполнения Telegram-каналов: чтение источников, LLM-обработка, ручное ревью, планирование и публикация через Bot API"
requires-python = ">=3.12"
dependencies = [
    "telethon>=1.36,<2",
    "aiogram>=3.7",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "sqlalchemy[asyncio]>=2.0",
    "alembic>=1.13",
    "asyncpg>=0.29",
    "redis>=5.0.1",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "itsdangerous>=2.1",
    "python-multipart>=0.0.9",
    "pywebpush",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]