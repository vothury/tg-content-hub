# Источники TG Content Hub.
#
# Этот файл — единое место управления источниками. Порядок применения:
#   правка файла -> git push -> git pull на сервере ->
#   либо `docker compose restart reader`, либо `make sources-sync`.
#
# Поля:
#   username          — публичный юзернейм канала, @ можно не писать (обязательно)
#   kind              — test (канал-лаборатория) | external (внешний канал)
#   enabled           — false = пауза опроса без удаления из базы
#   poll_interval_sec — интервал опроса, сек (по умолчанию из .env)
#   backfill_limit    — сколько последних постов прочитать при первом подключении
#   filters           — точечные переопределения предфильтра для источника
#
# Источник, удалённый из файла, отключается, но НЕ удаляется из базы.

# Карта контента: целевые каналы и источники.
# Применение: правка -> push -> pull -> make sources-sync (или рестарт reader).

# Целевые каналы (куда публикуем). Бот должен быть админом в каждом.
targets:
  - username: testimfilm
    title: "Кино тест"
    # daily_limit: 6          # максимум публикаций в день (Этап 5)
    # min_interval_min: 60    # минимальный интервал между публикациями (Этап 5)
    # лаборатория: берём всё свежее за 3 часа, без фолбэка вглубь
    # fresh_window_min: 180

  - username: testimfoto
    title: "Фото тест"

# Источники. Поле target — в какой целевой канал идут посты этого источника.
sources:
  - username: go_tests
    kind: test
    target: ваш_канал_1     # лабораторию привяжите к любому каналу

  - username: kino_filmach
    kind: external
    target: ваш_канал_2     # пример: этот источник — во второй канал
    # poll_interval_sec: 300
    # filters:
    #   min_text_len: 150
    #   blacklist_words: ["#реклама", "# реклама"]
    # fresh_window_min: 60
    # fallback_count: 2
    # fallback_max_age_hours: 48
