# =============================================================================
# TG Content Hub — карта контента
# Единое место управления: стили каналов, целевые каналы, источники.
# Применение: правка (на Windows) -> git push -> git pull на сервере ->
#             make sources-sync
# Источник, удалённый из файла, отключается, но НЕ удаляется из базы.
# =============================================================================

# --- Стили каналов (профили рерайта) ------------------------------------------
#   name                 — уникальное имя профиля
#   rewrite_prompt       — инструкции для рерайта (многострочный текст через "|")
#   preserve_source_tone — мягкий рерайт с сохранением тона исходника
# Каналу без указанного стиля применяется профиль `default`.

styles:
  - name: default
    preserve_source_tone: true

  - name: kino_style
    preserve_source_tone: false
    rewrite_prompt: |
      Кино-канал: короткие энергичные новости без канцелярита.
      Начинай с главного, 1–3 абзаца, без кликбейта и воды.
      Имена и названия фильмов — как в исходнике.

# --- Целевые каналы (куда публикуем) ------------------------------------------
#   Бот должен быть админом в каждом канале.
#   style               — имя профиля из блока styles
#   daily_limit         — максимум публикаций в день (Этап 5)
#   min_interval_min    — минимальный интервал между публикациями (Этап 5)
#   quiet_hours         — тихие часы: {"start": "23:00", "end": "08:00"}
#
# double_check_fact_strictness (1–10, дефолт глобальный 4) — глубина проверки фактов:
# ≤5 — только явные серьёзные ошибки;
# 6–7 — придирчиво, но без фанатизма;
# 8–9 — сверяет ключевые даты/имена/рейтинги;
# 10 — досконально.

targets:
  - username: testimfilm
    title: "Кино тест"
    description: "Канал о кино: новости фильмов, трейлеры, кастинги, релизы, сборы, подборки"
    dup_recap: false        # true = дубль опубликованной темы публикуется с блоком «Ранее об этом уже писали»; false = дубль подавляется без блока
    style: kino_style
    rewrite: false
    autopilot: true
    autopilot_min_score: 7
    review_if_uncertain: true
    double_check: true
    double_check_online: false            # проверять спорные факты через веб-поиск (модель :online)
    double_check_fact_strictness: 5      # важность точности фактов 1-10
    daily_limit: 30
    min_interval_min: 30

  - username: testimfoto
    title: "Фото тест"
    description: "Фото-канал: атмосферные кадры, фотоподборки, визуальные истории"
    dup_recap: true        # дубли публикуются с блоком «Ранее об этом уже писали»
    rewrite: false
    autopilot: true
    autopilot_min_score: 7
    review_if_uncertain: true
    double_check: true
    double_check_online: false            # проверять спорные факты через веб-поиск (модель :online)
    double_check_fact_strictness: 5      # важность точности фактов 1-10
    # autopilot_sig_guard не указан = true (безопасный дефолт для боевых каналов, ловит случаи, когда CLEAN/рерайт пропустили чужую подпись)
    daily_limit: 30
    min_interval_min: 30
    # стиль не указан -> профиль default

  # Канал-агрегатор: склад сырья из релевантных TG-каналов   
  - username: moskva_novostroy
    title: "Москва Новострой агрегатор"
    description: "Агрегатор новостей о новостройках Москвы и Подмосковья (сырьё для редакции)"
    rewrite: false
    autopilot: false
    double_check: false
    no_review: true          # технический канал: без карточек ревью, только префильтр (реклама)
    aggregate_mode: repost   # credit | repost | none
    autopilot_sig_guard: false   # агрегатору предохранитель не нужен
    aggregate_min_score: 6
    aggregate_accept: >
      проекты и ЖК Москвы и ближнего Подмосковья, старты продаж и цены на первичке,
      ипотека и господдержка, ввод в эксплуатацию, разрешения на строительство,
      статистика первичного рынка, действия девелоперов и властей по теме
    aggregate_reject: >
      вторичный рынок и аренда, загородка/дачи/особняки, регионы кроме Москвы и области,
      ЖКХ и тарифы, ритейл и гипермаркеты, развлекательные видео и мемы, подборки фильмов,
      зарубежная недвижимость, реклама и партнёрские интеграции
    daily_limit: 50
    min_interval_min: 1

  # Редакционный канал: сюда публикует виртуальная редакция
  - username: testim_novostroyki
    title: "Тест Новостройки Москвы"
    description: "Аналитика недвижимости Москвы и ближнего Подмосковья: разборы, синтез сигналов, тренды"
    editorial: true            # канал виртуальной редакции
    rewrite: true
    autopilot: false
    double_check: false
    daily_limit: 3
    min_interval_min: 60

# --- Источники (откуда читаем) -------------------------------------------------
#   kind       — test (канал-лаборатория) | external (внешний канал)
#   target     — в какой целевой канал идут посты этого источника
#   relevance  — релевантность источника каналу, 1–10:
#                  8–10: почти всё уходит на ревью, фильтр только на рекламу и запрещёнку
#                  4–7:  обычная оценка с учётом тематики канала
#                  1–3:  строгий тематический фильтр (общеновостные источники)
#   filters    — точечные переопределения предфильтра
#   Свежесть (если не указано — глобальные значения из .env):
#     fresh_window_min, fallback_count, fallback_max_age_hours

# Общий набор фильтров, чтобы не дублировать на каждый источник
x_filters_default: &filters_default
  min_text_len: 1
  blacklist_words: ["#реклама", "# реклама"]

sources:
  # ================= источники для: testimfilm =================
  - username: go_tests
    kind: test
    target: testimfilm
    relevance: 9
    filters: *filters_default

