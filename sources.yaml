  - username: BSPhistorychannel
    kind: external
    target: testimfoto
    relevance: 5
    llm_instructions: >
      Формат канала — атмосферные фотоподборки и визуальные истории; основа поста — медиа, текст лишь подпись.
      Короткая подпись к фото (вплоть до одного предложения или только «место + год») — ХОРОШИЙ формат, НЕ снижай за неё оценку и НЕ ставь off_topic/water.
      Снижай оценку до 2 и ставь category "off_topic" ТОЛЬКО для: фотографий из СССР, локальных знаменитостей без мировой известности, военной тематики, длинных исторических справок, а так же текстовых постов без медиа.
      Так же снижай оценку если прикрепленных фото более 1.
      Рекламу и партнёрские интеграции отклоняй как обычно.
    filters:
      min_text_len: 1
      max_text_len: 500        # громоздкие исторические простыни не форматы канала
      blacklist_words: ["#реклама", "# реклама"]
    # poll_interval_sec: 300

